# The desktop app (phase 3: Tauri instead of Electron). Its own workspace: the musl build of ../ (hook, bridge) never sees it.
[workspace]

[package]
name = "ccpet-app"
version = "0.7.4"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lib]
name = "ccpet_app"
path = "src/lib.rs"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sys-locale = "0.3"
ccpet-core = { path = "../ccpet-core" }
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
miniz_oxide = "0.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_Controls", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
