[workspace]
resolver = "2"
members = ["ccpet-hook", "ccpet-core", "ccpet-bridge"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# preserve_order: settings.json keeps the user's key order when the pet writes it back
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
