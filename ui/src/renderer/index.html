<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src data:">
  <title>ccPet</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="stage">
    <div id="sprite-wrap">
      <canvas id="sprite" class="hit"></canvas>
    </div>
    <div id="dock"><div id="dock-pill" class="hit rest">
        <button id="btn-new" title="Чат" aria-label="Чат">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
      </button>
      <button id="btn-settings" title="Настройки" aria-label="Настройки">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
      <button id="btn-activity" title="Сессии" aria-label="Сессии">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 10v4M8 6v12M12 3v18M16 8v8M20 11v2"/></svg>
      </button>
    </div></div>
    <div id="chip" class="hit">
      <button id="usage-ring" class="hit" type="button" aria-haspopup="dialog" aria-expanded="false" title="Лимиты плана: данных нет" data-level="none">
        <svg viewBox="0 0 36 36" width="26" height="26" aria-hidden="true"><circle class="track" cx="18" cy="18" r="15.9155" /><circle class="arc" cx="18" cy="18" r="15.9155" stroke-dasharray="0 100" /></svg>
        <span id="dot"></span>
        <span id="usage-ring-text">—</span>
      </button>
      <span id="label"><span id="label-t"></span></span><span id="detail"></span>
    </div>
    <div id="perm" class="hit" hidden>
      <span id="perm-text"></span>
      <button id="btn-allow">Разрешить</button><button id="btn-deny">Отклонить</button>
    </div>
    <div id="notice" class="hit" hidden></div>
    <div id="sessions" class="hit" hidden></div>
    <div id="settings" class="hit" role="dialog" aria-label="Настройки ccPet" hidden></div>
    <div id="usage" class="hit" role="dialog" aria-label="Лимиты использования плана" hidden></div>
    <div id="chat" class="hit" hidden>
      <div id="chat-head">
        <button id="chat-switch" title="Сменить чат (Ctrl+Tab)" aria-haspopup="listbox" aria-expanded="false"><span id="chat-title"></span>
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
        <button id="btn-term" class="head-btn" title="Открыть в терминале" aria-label="Открыть в терминале" hidden>
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M7 9l3 3-3 3M12 15h5"/></svg>
        </button>
        <button id="btn-end" class="head-btn" title="Завершить сессию" aria-label="Завершить сессию" hidden>
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M9 9l6 6M15 9l-6 6"/></svg>
        </button>
        <button id="btn-close" class="head-btn" title="Свернуть" aria-label="Свернуть">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>
        </button>
      </div>
      <div id="chat-menu" role="listbox" hidden></div>
      <div id="models" hidden></div>
      <div id="cmds" role="listbox" hidden></div>
      <div id="chat-list"></div>
    </div>
    <div id="pill" class="hit" hidden>
      <div id="compose" hidden>
        <button id="btn-folder" title="Новый чат в папке…" aria-label="Новый чат в папке">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <input id="input" type="text" autocomplete="off" spellcheck="false" placeholder="Начать новый чат">
        <button id="btn-stop" title="Остановить" aria-label="Остановить" hidden>
          <svg viewBox="0 0 24 24" width="14" height="14"><rect x="5" y="5" width="14" height="14" rx="2.5" fill="currentColor"/></svg>
        </button>
        <button id="btn-send" title="Отправить" aria-label="Отправить">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
      </div>
    </div>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
