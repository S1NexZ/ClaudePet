name: CI

on:
  push:
    branches: [v0.3-dev, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: cd ui && npm ci
        env: { ELECTRON_SKIP_BINARY_DOWNLOAD: '1' }
      - run: npm test
      - run: npm run build
      - name: Python wrapper tests
        run: python3 scripts/test-pet-claude.py

  package:
    name: Package (${{ matrix.name }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux, os: ubuntu-latest, script: 'dist:linux' }
          - { name: macos, os: macos-latest, script: 'dist:mac' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: cd ui && npm ci
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: ccPet-${{ matrix.name }}
          path: |
            ui/release/*.AppImage
            ui/release/*.deb
            ui/release/*.dmg
            ui/release/*.zip
          if-no-files-found: error

  smoke-linux:
    name: Starts and connects (Linux)
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: ccPet-linux, path: dl }
      - name: Install a fake claude and run the app under Xvfb
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libfuse2t64 || sudo apt-get install -y -qq xvfb libfuse2
          chmod +x dl/*.AppImage
          mkdir -p "$HOME/.local/bin" && printf '#!/bin/sh\necho claude\n' > "$HOME/.local/bin/claude" && chmod +x "$HOME/.local/bin/claude"
          xvfb-run -a dl/*.AppImage --appimage-extract-and-run --no-sandbox --screenshot=/tmp/shot.png --shot-delay=9000 || true
          test -s /tmp/shot.png
          LOG="$HOME/.config/Claude Pet/pet.log"
          cat "$LOG"
          grep -q "bridge wsl ready" "$LOG"

  release-assets:
    name: Attach Linux and macOS builds to the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package, smoke-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dl, pattern: ccPet-*, merge-multiple: true }
      - name: Upload (waits for the release page that is created together with the tag)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -la dl
          for i in $(seq 1 40); do gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 && break; sleep 30; done
          gh release upload "$TAG" dl/* -R "$GITHUB_REPOSITORY" --clobber
