name: CI

on:
  push:
    branches: [v0.3-dev, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Linux libraries the Tauri app (WebKitGTK webview, tray) builds against
env:
  TAURI_LINUX_DEPS: libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: cd ui && npm ci
        env: { ELECTRON_SKIP_BINARY_DOWNLOAD: '1' }
      - run: npm test
      - run: npm run build
      - name: Python wrapper tests
        run: python3 scripts/test-pet-claude.py

  rust:
    name: Rust tests (core, hook, bridge, app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq $TAURI_LINUX_DEPS
      - name: core, hook, bridge
        working-directory: native
        run: cargo test
      - name: app logic (lib)
        working-directory: native/app
        # tauri-build copies the bundle resources: the shipped binaries only need to exist here
        run: |
          mkdir -p ../../build/hook && touch ../../build/hook/ccpet-bridge ../../build/hook/ccpet-hook
          cargo test --lib

  package:
    name: Package (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows, os: windows-latest, targets: 'x86_64-unknown-linux-musl', bundles: 'nsis', args: '' }
          - { name: linux, os: ubuntu-latest, targets: 'x86_64-unknown-linux-musl', bundles: 'deb,appimage', args: '' }
          - { name: macos, os: macos-latest, targets: 'aarch64-apple-darwin,x86_64-apple-darwin', bundles: 'dmg', args: '--target universal-apple-darwin' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: '${{ matrix.targets }}' }
      - if: matrix.name == 'linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq $TAURI_LINUX_DEPS
      - run: npm ci
      - run: cd ui && npm ci
        env: { ELECTRON_SKIP_BINARY_DOWNLOAD: '1' }
      # pet-helper.exe (Windows only), the bridge and hook the app ships, the renderer
      - run: node scripts/build-helper.mjs
        if: matrix.name == 'windows'
      - run: node scripts/build-native.mjs
      - run: node ui/build.mjs
      - name: Tauri bundle
        working-directory: native/app
        run: npx -y @tauri-apps/cli@2 build --bundles ${{ matrix.bundles }} ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: ccPet-${{ matrix.name }}
          path: |
            native/app/target/**/bundle/nsis/*.exe
            native/app/target/**/bundle/deb/*.deb
            native/app/target/**/bundle/appimage/*.AppImage
            native/app/target/**/bundle/dmg/*.dmg
          if-no-files-found: error
      - name: Attach to the release (tags only; waits for the release page created with the tag)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          for i in $(seq 1 40); do gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 && break; sleep 30; done
          shopt -s nullglob globstar
          files=(native/app/target/**/bundle/nsis/*.exe native/app/target/**/bundle/deb/*.deb native/app/target/**/bundle/appimage/*.AppImage native/app/target/**/bundle/dmg/*.dmg)
          gh release upload "$TAG" "${files[@]}" -R "$GITHUB_REPOSITORY" --clobber

  smoke-linux:
    name: Starts and connects (Linux)
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: ccPet-linux, path: dl }
      - name: Install the .deb and run the app under Xvfb with a fake claude
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb dbus-x11
          DEB=$(find "$PWD/dl" -type f -name '*.deb' | head -1)   # apt needs a path, else it reads a package name
          echo "deb: $DEB"
          sudo apt-get install -y -qq "$DEB"
          mkdir -p "$HOME/.local/bin" && printf '#!/bin/sh\necho claude\n' > "$HOME/.local/bin/claude" && chmod +x "$HOME/.local/bin/claude"
          LOG="$HOME/.config/Claude Pet/pet.log"
          BIN=$(dpkg -L "$(dpkg-deb -f "$DEB" Package)" | grep '/usr/bin/' | head -1)
          echo "binary: $BIN"
          # a desktop session has a D-Bus session bus (single instance, tray, notifications use it); the runner has none
          timeout 25 dbus-run-session -- xvfb-run -a "$BIN" || true
          cat "$LOG"
          grep -q "\[tauri\] started" "$LOG"
          grep -q "bridge wsl ready" "$LOG"
